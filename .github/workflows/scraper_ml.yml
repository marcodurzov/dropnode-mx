name: DropNode ML Scraper

on:
  schedule:
    # Horas en UTC (México = UTC-6). 6:00 AM-11:59 PM MX cada 15 min;
    # 12:00-5:59 AM MX cada hora (solo para errores de precio score 8+).
    - cron: '*/15 12-23 * * *'
    - cron: '*/15 0-5 * * *'
    - cron: '0 6-11 * * *'
  workflow_dispatch:

concurrency:
  group: dropnode-ml
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests supabase==1.2.0 playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run ML scraper
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHANNEL_FREE_ID: ${{ secrets.CHANNEL_FREE_ID }}
          CHANNEL_VIP_ID: ${{ secrets.CHANNEL_VIP_ID }}
          ML_APP_ID: ${{ secrets.ML_APP_ID }}
          ML_SECRET: ${{ secrets.ML_SECRET }}
          ML_AFFILIATE_ID: ${{ secrets.ML_AFFILIATE_ID }}
          AMAZON_TAG: ${{ secrets.AMAZON_TAG }}
          LAUNCHPASS_LINK: ${{ secrets.LAUNCHPASS_LINK }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
          SCRAPER_API_KEY: ${{ secrets.SCRAPER_API_KEY }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: python github_scraper_ml.py
